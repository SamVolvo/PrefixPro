name: PrefixPro
version: '${project.version}'
main: com.samvolvo.prefixPro.PrefixPro
api-version: '1.20.6'
prefix: PrefixPro
authors: [ SamVolvo ]
website: https://samvolvo.com
depend: [LuckPerms]

commands:
  afk:
    description: Toggle AFK status
    usage: /afk
    permission: prefixpro.afk
  prefixpro:
    description: Plugin management commands
    usage: /prefixpro <config|plugin> reload
    permission: prefixpro.admin

permissions:
  prefixpro.afk:
    description: Allows use of AFK features
    default: true
  prefixpro.admin:
    description: Allows use of admin commands
    default: op
